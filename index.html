<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <h1 class="tituloPrincipal">
            Primeiro formulario
        </h1>
    </header>
    <main>
     <main class="principal">
        <form class="formulario">
            <h2 class="tituloFormulario">
                Login
            </h2>
            <div class="caixaCampo">
                <label for="nomecampo" class="rotuloCampo">
                    Nome
                </label>
                <input type="text" class="campoFormulario" id="nomecampo">
            </div>
            <div class="caixaCampo">
                <label for="emailcampo" class="rotuloCampo">
                    Email
                </label>
                <input type="email" class="campoFormulario" id="emailcampo">
            </div>
            <div class="caixaCampo">
                <label for="senhacampo" class="rotulocampo">
                    Senha
                </label>
                <input type="senha" class="campoFormulario" id="senhacampo">
            </div>
            <button class="btnEnviar">enviar</button>
        </form>
     </main>
    </main>
</body>
</html>
